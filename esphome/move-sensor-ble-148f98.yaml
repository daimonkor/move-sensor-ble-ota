# Move Sensor BLE — датчик 148f98 (Device ID = хвост MAC Wi-Fi, точка доступа MoveSensorBLE-148F98).
# Вся прошивка — в move_sensor_ble/base.yaml. Новый датчик: скопировать этот файл,
# заменить 148f98 на его Device ID (в HA: устройство Move Sensor BLE OTA -> Device ID).
substitutions:
  name: move-sensor-ble-148f98
  friendly_name: Move Sensor BLE 148f98
  mac_suffix: "false"
  # RSSI этого датчика в HA: устройство BTHome -> Signal strength (у каждого датчика своя сущность)
  # 2026-11-16: Signal (dBm) интеграции Move Sensor BLE (BTHome-устройство удалено)
  ble_rssi_entity: sensor.koridor_move_sensor_ble_signal_2

packages:
  base: !include move_sensor_ble/base.yaml
