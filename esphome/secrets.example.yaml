# Скопировать в secrets.yaml (рядом с move-sensor-ble.yaml) и заполнить.
wifi_ssid: "MyWiFi"
wifi_password: "password"
move_sensor_ap_password: "password-for-sensor-ap"     # своя точка доступа датчика (сервисный режим)
move_sensor_ble_ota_key: "long-random-secret"         # HMAC-ключ BLE OTA — тот же берёт интеграция HA
# для tools/ble_ota_flash.py: долгоживущий токен администратора HA
ha_token: "eyJ..."
