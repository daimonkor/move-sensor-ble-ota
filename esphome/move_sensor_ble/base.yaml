# Move Sensor BLE — батарейный датчик движения, BTHome v2 (BLE) + deep sleep
# Плата: Seeed XIAO ESP32-C3
#
# Подключение (все кнопки/сигналы активны по HIGH):
#   D1 / GPIO3  — сигнал PIR: SR602 OUT -> R1 1 кОм -> D1, C1 10 мкФ на GND
#   D2 / GPIO4  — сервисный ПЕРЕКЛЮЧАТЕЛЬ с фиксацией (GPIO4 <-> 3V3):
#                замкнут = сервисный режим (не спит, Wi-Fi/OTA/настройки), разомкнут = работа и сон
#   D0 / GPIO2  — АЦП батареи (Seeed wiki check_battery_voltage): BAT+ --[1M]--+--[1M]-- GND,
#                середина на A0/GPIO2, 100 нФ с A0 на GND ОБЯЗАТЕЛЬНО (делитель высокоомный, ~2 мкА).
#                BAT+ — площадка снизу платы (BAT- не используется, «-» АКБ в B1 -> GND).
#   D10 / GPIO10 — индикатор срабатываний: D10 -> R4 100 Ом -> синий LED -> GND.
#                1 вспышка = отправлено "занято", 2 = "свободно". Постоянно не горит.
#                Включили WiFi (сервисный режим): 3 медленные вспышки; 2-е включение за 10 с —
#                2 коротких (счёт к заводскому сбросу), 3-е — 6 быстрых (сброс). Identify — частое 10 с.
#                Отключается выключателем "Motion tracking LED" в HA (по умолчанию включён, выбор хранится во флеше).
#   D4 / GPIO6  — I2C SDA  \ датчик температуры/влажности SHT41 (модуль 10x13 на крышке, адрес 0x44):
#   D5 / GPIO7  — I2C SCL  /  VIN -> 3V3, GND -> GND. Подтяжки I2C — на модуле (проверь у своего).
#                Без датчика прошивка работает как раньше: температура/влажность просто не шлются.
#                Для SHT31-D: platform: sht3xd вместо sht4x (остальное то же).
#   На обе кнопки желательна внешняя подтяжка к GND 10–100 кОм.
#
# Режимы:
#   Обычный  — спит, просыпается от PIR/таймера, шлёт BTHome, засыпает. Wi-Fi выключен.
#   Сервис   — переключатель на D2 включён: не спит, Wi-Fi + API + OTA + логи + веб-страница, без таймаута.
#              Выключил переключатель - сразу рабочий режим и сон.
#              Режим задаёт только положение переключателя, в том числе после потери питания:
#              включён - Wi-Fi поднимается, выключен - Wi-Fi не включается вообще.

substitutions:
  # Версия прошивки (2026-11-16, 1.4.0): её показывает интеграция HA рядом с номером сборки, она же в
  # move_sensor_ble/CHANGELOG.md. Поднимает tools/changelog.py release X.Y.Z (руками — тоже здесь).
  fw_version: "1.7.3"
  # Значения по умолчанию — их переопределяет файл датчика в корне esphome/
  # (move-sensor-ble-<Device ID>.yaml: name, friendly_name, mac_suffix: "false").
  name: move-sensor-ble
  friendly_name: Move Sensor BLE
  mac_suffix: "true"
  pir_gpio: "3"            # D1
  service_gpio: "4"        # D2
  vbat_gpio: "2"           # D0 / A0
  vbat_divider: "2.0"      # начальное значение "Voltage factor": делитель 1М+1М (1:1) = 2.0 (на пинах реально 3.29 В, АЦП видит 1.647 В — сходится)
                           # дальше множитель меняется в HA (сервисный режим), хранится во флеше
  # Сколько не спим после публикации, чтобы приёмник успел услышать пакет.
  # Должно быть больше паузы в сканировании приёмника. esphome-bluetooth-proxy с 2026-11-14
  # на настройках ESPHome по умолчанию (interval 320 мс, window = interval) — слушает почти
  # всё время; было 4200/420 (паузы 3,8 с), отсюда 4500ms. Короче окно — меньше расход:
  # замер нужного окна — быстрый тест с tx_window_ms (сервис move_sensor_ble_ota.fast_test).
  tx_window: 4500ms
  tx_window_ms: "4500"     # то же в мс для лямбд (быстрый тест может временно заменить окно)
  led_gpio: "10"           # D10
  sda_gpio: "6"            # D4
  scl_gpio: "7"            # D5
  # сущность HA с RSSI этого датчика (2026-11-16: Signal (dBm) устройства Move Sensor BLE). Значение по умолчанию —
  # заглушка: задавай ble_rssi_entity в файле датчика (move-sensor-ble-<ID>.yaml), у каждого своя
  ble_rssi_entity: sensor.move_sensor_ble_signal
  # Заводской сброс переключателем (2026-11-15): включить сервисный режим wifi_reset_toggles раз подряд,
  # первое и последнее включения не дальше wifi_reset_window_ms -> сеть роутера сбрасывается на сеть
  # из прошивки (secrets.yaml) БЕЗ отката И пароль своей точки доступа — на заводской, LED мигает 6 раз.
  # Считается и через сон (RTC). То же делает команда сброса по BLE из HA (script factory_reset_net).
  # 2026-11-15: было 5 включений за 20 с — по просьбе Димы 3 за 10 с
  wifi_reset_toggles: "3"
  wifi_reset_window_ms: "10000"
  # сеть из прошивки — для сброса (лямбда не умеет !secret напрямую)
  fw_wifi_ssid: !secret wifi_ssid
  fw_wifi_password: !secret wifi_password
  # заводской пароль своей точки доступа (на наклейке); свой пароль задаётся с сайта датчика
  fw_ap_password: !secret move_sensor_ap_password

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # версия прошивки для ESPHome (видна в ESPHome-устройстве в HA, сервисный режим)
  project:
    name: daimonkor.move_sensor_ble
    version: ${fw_version}
  # 2026-11-15: это общий шаблон (move_sensor_ble/base.yaml). В ESPHome Builder у каждого датчика
  # своя карточка — move-sensor-ble-<Device ID>.yaml в корне esphome/ с именем целиком
  # (move-sensor-ble-148f98) и mac_suffix: "false". Device ID = хвост MAC Wi-Fi.
  # Точка доступа — MoveSensorBLE-<DEVICE ID> (ap_portal: ssid_suffix_mac).
  name_add_mac_suffix: ${mac_suffix}
  includes:
    - move_sensor_rtc.h
  on_boot:
    # первым делом снимаем удержание пина LED, которое ставится перед сном
    - priority: 1000
      then:
        - lambda: |-
            gpio_hold_dis((gpio_num_t) ${led_gpio});
            // IDF держит (gpio_hold) пины пробуждения с подтяжкой на время сна; снимаем, чтобы
            // binary_sensor pir_raw снова поставил свою (pulldown) — иначе после пробуждения
            // по LOW на D1 осталась бы подтяжка вверх
            gpio_hold_dis((gpio_num_t) ${pir_gpio});
    # замер батареи ДО запуска радио: АЦП уже готов (600), BLE (350) и Wi-Fi (250) ещё нет —
    # это почти напряжение покоя, по нему и считается процент (см. move_sensor_rtc.h)
    - priority: 550
      then:
        - lambda: |-
            // 2026-11-15: SSID точки доступа = MoveSensorBLE-<хвост MAC Wi-Fi> (Device ID), до старта Wi-Fi
            ms::bat_phase = 1;
            id(vbat).update();
            ms::bat_phase = 2;
            // версия сборки (как «Build Version») — HA читает её по BLE (move_sensor_ble_ota)
            id(build_version_text).update();
            id(bth_ota).set_build_version(id(build_version_text).state);
            // 2026-11-14: сброс Wi-Fi по BLE (команда 0x12 от интеграции HA); с 2026-11-15 — заводской
            // сброс сети: сеть роутера из прошивки + заводской пароль своей точки (factory_reset_net).
            // В рабочем режиме Wi-Fi выключен — ставим флаг (NVS), сброс при входе в сервисный режим;
            // если уже в сервисном — сразу. LED: 6 вспышек — команда принята.
            id(bth_ota).set_wifi_reset_callback([]() {
              if (id(service_mode)) {
                ESP_LOGW("ms", "factory reset over BLE: now");
                id(factory_reset_net).execute();
              } else {
                id(wifi_reset_pending) = true;
                ESP_LOGW("ms", "factory reset over BLE: will apply on next service mode");
                id(wifi_reset_blink).execute();
              }
            });
            // найти датчик (команда 0x14 IDENTIFY из HA): мигать светодиодом N с, не засыпая
            id(bth_ota).set_identify_callback([](uint8_t sec) {
              id(identify_left) = sec * 2;   // полсекунды на вспышку
              id(identify_blink).execute();
            });
            // быстрый тест по BLE (команда 0x13): просыпаться раз в 30 с, выключится сам через N мин
            id(bth_ota).set_test_mode_callback([](uint8_t minutes, uint16_t tx_ms) {
              ms::test_until_ms = minutes ? ms::now_ms() + (int64_t) minutes * 60000 : 0;
              ms::test_tx_ms = minutes ? tx_ms : 0;   // 0 = окно из прошивки (${tx_window})
              ESP_LOGW("ms", "fast test mode: %s, tx_window %u ms", minutes ? "ON" : "OFF",
                       (unsigned) ms::tx_window_ms(${tx_window_ms}));
            });
            // номер правки настроек (v1.15): из своей preference в NVS; 0 = свежий NVS
            {
              static ESPPreferenceObject rev_pref = global_preferences->make_preference<uint8_t>(ms::SETTINGS_REV_KEY);
              uint8_t r = 0;
              if (rev_pref.load(&r)) ms::settings_rev = r;
              id(bth_ota).set_rev_hook([]() -> uint8_t {
                if (ms::rev_pending) {
                  ms::rev_pending = false;
                  ms::settings_rev = ms::rev_next(ms::settings_rev);
                  rev_pref.save(&ms::settings_rev);
                  global_preferences->sync();   // сразу во флеш: правка не теряется при пропадании питания
                  ESP_LOGI("ms", "settings revision -> %u", (unsigned) ms::settings_rev);
                  id(settings_rev_sensor).publish_state(ms::settings_rev);
                  id(custom_data_update).execute();
                }
                return ms::settings_rev;
              });
            }
    - priority: -100
      then:
        # v1.15: настройки восстановлены из флеша — дальнейшие изменения считаются правками
        - lambda: |-
            ms::boot_done = true;
            id(settings_rev_sensor).publish_state(ms::settings_rev);
        # 1.7.0: пароль точки, заданный с сайта до перехода на ap_portal (globals ap_password_custom),
        # один раз переносится в библиотеку (её NVS) — у пользователя пароль не меняется.
        - lambda: |-
            const std::string &pw = id(ap_password_custom);
            if (pw.size() >= 8) {
              // переносим только то, что библиотека примет (8–63 печатных ASCII); иначе оставляем как есть
              bool ok = pw.size() <= 63;
              for (char c : pw) ok = ok && c >= 0x20 && c <= 0x7E;
              if (ok) {
                id(portal).set_password(pw);
                id(ap_password_custom) = "";
                ESP_LOGW("ms", "AP password: custom password moved to ap_portal");
              } else {
                ESP_LOGW("ms", "AP password: stored custom password is not valid for ap_portal - not moved");
              }
            }
        - script.execute: boot_dispatch

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  cpu_frequency: 80MHZ
  framework:
    type: esp-idf

external_components:
  # локальная копия dz0ny/esphome-bthome (commit 49d5850) с патчем:
  # packet_id и счётчик шифрования хранятся в RTC-памяти и переживают deep sleep
  - source:
      type: local
      path: components
    components: [bthome]
  # 1.5.0: батарея — библиотека li_battery (github.com/daimonkor/esphome-li-battery), версия по тегу
  - source: github://daimonkor/esphome-li-battery@v1.0.0
    components: [li_battery]
  # 1.7.0: своя точка доступа — библиотека ap_portal (github.com/daimonkor/esphome-ap-portal):
  # точка рядом с роутером в сервисном режиме, DNS, окно «Войти в сеть», попап «Wi-Fi роутера».
  # Закреплена на теге релиза (v0.1.2 — защита API от CSRF и чтения чужими сайтами, одно действие Wi-Fi за раз): сборка повторяемая, правка библиотеки попадает в датчик
  # только сменой этой строки (и видна интеграции HA как изменение файлов прошивки).
  - source: github://daimonkor/esphome-ap-portal@v0.1.2
    components: [ap_portal]

logger:
  # 2026-11-14: в прошивку компилируется всё до DEBUG, но на старте уровень INFO —
  # в рабочем режиме на каждом пробуждении не уходят десятки DEBUG-строк в USB-JTAG.
  # DEBUG включается только в сервисном режиме (service_enter), при выходе — снова INFO.
  level: DEBUG
  initial_level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false     # в обычном режиме Wi-Fi не включается вообще
  fast_connect: true
  reboot_timeout: 0s
  # 1.7.0: ESPHome 2026.11 держит точку рядом с роутером сам (ap_mode: always_on), без хаков;
  # always_on требует отключить переход на роутер с лучшим сигналом после подключения.
  post_connect_roaming: false
  # Своя точка доступа (1.7.0 — библиотека ap_portal, раньше move_sensor_ble/ms_ap.h): живёт весь
  # сервисный режим параллельно с роутером, свой DNS, окно «Войти в сеть» и попап «Wi-Fi роутера».
  # В рабочем режиме Wi-Fi выключен целиком.
  ap:
    ap_mode: always_on
    # MoveSensorBLE-<Device ID> (хвост MAC Wi-Fi) — у каждого датчика свой (ap_portal: ssid_suffix_mac)
    ssid: "MoveSensorBLE"
    password: !secret move_sensor_ap_password
    # адрес вне частных диапазонов: иначе Android не показывает окно входа
    manual_ip:
      static_ip: 100.64.4.1
      gateway: 100.64.4.1
      subnet: 255.255.255.0

# Точка доступа датчика (1.7.0): библиотека ap_portal. Работает только в сервисном режиме.
# Окно «Войти в сеть» — стартовая страница в стиле сайта датчика; кнопка Wi-Fi на сайте и на
# стартовой странице открывает попап библиотеки (сети, смена сети роутера, пароль точки).
ap_portal:
  id: portal
  active: !lambda "return id(service_mode);"
  ssid_suffix_mac: true
  password_persist: true        # пароль, заданный с сайта, во флеше; заводской — в secrets (наклейка)
  password_reset:
    power_cycles: 0             # заводской сброс — переключателем WiFi (3 раза за 10 с) или по BLE
  api:
    from_home: true             # попап Wi-Fi работает и с сайта из домашней сети
  landing:
    mode: redirect
    title: "Move Sensor BLE"
    accent_color: "#3d7bff"
    icon_svg: '<svg viewBox="0 0 24 24"><g transform="translate(3 2.5) scale(.78)"><circle cx="13.5" cy="3.6" r="2"/><path d="M9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.3 7.3 0 0 0 19 13v-2a5 5 0 0 1-4.3-2.4l-1-1.6a2 2 0 0 0-2.5-.8L6 8.3V13h2V9.6z"/></g></svg>'

# Wi-Fi-сущности для HA: текущая сеть, IP, какой пароль у точки, сброс сети на прошивочную
packages:
  wifi_setup: !include wifi_setup.yaml

api:
  reboot_timeout: 0s
  # 1.4.0: шифрование API (сервисный режим, датчик в домашней сети). HA берёт ключ сам из ESPHome Builder
  # (повторная авторизация ESPHome-устройства после прошивки); ключ — move_sensor_api_key в secrets.yaml
  encryption:
    key: !secret move_sensor_api_key

ota:
  - platform: esphome
    # 1.4.0: без пароля любой в домашней сети мог залить прошивку по Wi-Fi, пока включён сервисный режим.
    # ESPHome Builder и интеграция (прошивка по Wi-Fi) берут его из этого YAML. BLE OTA — свой ключ (bthome: ble_ota)
    password: !secret move_sensor_ota_password

# Откат прошивки (как в весах и CAN-шине): новая прошивка считается рабочей, если
# проработала boot_is_good_after без краша. Если упала/перезагрузилась раньше —
# загрузчик ESP-IDF возвращает предыдущую (esp32: framework: advanced:
# enable_ota_rollback, по умолчанию true; загрузчик с откатом прошивается только по USB).
# 10 таких сбоев подряд -> safe mode на 5 мин (только Wi-Fi + OTA).
# Сон: с ESPHome 2026.8 штатный уход в deep sleep тоже подтверждает загрузку, поэтому
# в go_sleep после холодного старта/OTA ждём до 15 с аптайма — прошивка честно проходит проверку.
safe_mode:
  boot_is_good_after: 15s
  num_attempts: 10
  reboot_timeout: 5min

# Веб-интерфейс для отладки: состояния, настройки и лог в браузере.
# Доступен только когда поднят Wi-Fi, то есть в сервисном режиме (переключатель на D2):
# через свою точку «MoveSensorBLE-148F98» — http://100.64.4.1/ (доменное имя на лендинге не работает),
# из домашней сети — по IP датчика или http://move-sensor-ble.local. В рабочем режиме и во сне Wi-Fi выключен,
# поэтому страница недоступна и радио на неё не тратится.
web_server:
  port: 80
  version: 3
  # Сайт датчика (2026-11-11): /0.js = site_bundle.js — своя панель «Датчик» (движение,
  # температура, влажность, батарея, сигнал, диагностика; без истории) + вкладка «Устройство»
  # со штатным интерфейсом v3, вшитым в бандл (интернет не нужен). Собирать:
  #   node move_sensor_ble/site/build.js   (исходники — move_sensor_ble/site/)
  # js_url: "" — не тянуть www.js с CDN. НЕ ставить local: true — тогда главная не грузит /0.js.
  js_url: ""
  js_include: move_sensor_ble/site_bundle.js

# -------------------------------------------------------------------- I2C
i2c:
  sda: GPIO${sda_gpio}
  scl: GPIO${scl_gpio}
  scan: false          # 2026-11-14: скан шины выключен (SHT41 найден, лишнее время на каждом пробуждении)
  frequency: 100kHz
  timeout: 50ms        # зависшая шина не должна держать плату проснувшейся

# ---------------------------------------------------------------- deep sleep
deep_sleep:
  id: ds
  # run_duration не задан: засыпаем только сами, через deep_sleep.enter
  # wakeup_pin НЕ задаём (2026-11-14): пробуждение по PIR (D1) настраивает go_sleep сам —
  # по HIGH (новое движение) или по LOW (отпускание PIR), по одному замеру уровня перед сном.
  # Встроенный INVERT_WAKEUP делает похожее, но читает пин отдельно от нашей логики.

# Wi-Fi-канал (2026-11-15): найти датчик (мигать LED 10 с), как кнопка Identify интеграции по BLE
button:
  - platform: template
    name: "Identify"
    id: identify_btn
    icon: mdi:led-on
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(identify_left) = 20;   // полсекунды на вспышку -> 10 с
          id(identify_blink).execute();

globals:
  # сброс Wi-Fi переключателем набран — выполнить после wifi.enable (service_enter)
  # restore_value (2026-11-14): флаг может поставить BLE-команда в рабочем режиме — должен дожить
  # (во флеше) до следующего входа в сервисный режим
  - id: wifi_reset_pending
    type: bool
    restore_value: true
    initial_value: "false"
  # 2026-11-15: свой пароль точки доступа (с сайта датчика, во флеше). Пусто = заводской
  # (fw_ap_password). Сбрасывается заводским сбросом (3 включения SW2 за 10 с / BLE).
  - id: ap_password_custom
    type: std::string
    restore_value: true
    max_restore_data_length: 64
    initial_value: '""'
  - id: service_mode
    type: bool
    restore_value: false
    initial_value: "false"
  - id: tx_pending
    type: bool
    restore_value: false
    initial_value: "false"
  # в этом окне ушёл пакет «движение/пусто» -> Motion window, иначе Climate window
  - id: tx_motion
    type: bool
    restore_value: false
    initial_value: "false"
  # Identify: сколько полусекундных вспышек осталось (0 = не мигаем)
  - id: identify_left
    type: int
    restore_value: false
    initial_value: "0"
  # сервисный режим включён переключателем на D2 (а не холодным стартом / из HA)
  - id: service_by_switch
    type: bool
    restore_value: false
    initial_value: "false"
  # проснулись от PIR-пина: само пробуждение и есть "движение"
  - id: woke_by_pir
    type: bool
    restore_value: false
    initial_value: "false"

# ------------------------------------------------------------------ батарея
# 1.5.0: процент, сглаживание, «низкий» (<= 10 %, снимается от 15 %) и «критический» (покой <= 3.50 В,
# снимается от 3.65 В) — библиотека li_battery. Датчик сам меряет напряжение покоя (замер до радио,
# поправка на просадку под Wi-Fi — сенсор Voltage ниже) и отдаёт его в id(bat).process_voltage().
# Состояние в RTC — переживает deep sleep. Флаги ms::bat_low / ms::bat_crit — копия для сна и климата.
li_battery:
  id: bat
  chemistry: lipo
  capacity: bat_capacity          # 1.6.0: настройка (мА·ч) — сайт / ESPHome и по BLE из HA
  restore: rtc
  low: bat_low_level              # 1.6.0: настройка (%), снимается на 5 % выше
  critical: 3.50                  # защита банки — только в прошивке
  resume: 3.65
  remaining:                      # 1.6.0: остаток, мА·ч (ёмкость × процент) — сервисный режим
    name: "Battery remaining"
    entity_category: diagnostic

# ------------------------------------------------------------------ BTHome
bthome:
  id: bth
  ble_stack: nimble
  # OTA по BLE (2026-11-14, components/bthome/ble_ota.*): пока датчик не спит (окно отправки
  # после PIR / таймера телеметрии), реклама подключаемая. Интеграция HA move_sensor_ble_ota
  # подключается через Bluetooth-прокси, авторизуется ключом и льёт firmware.bin.
  # Пока клиент подключён или идёт прошивка — датчик не засыпает (go_sleep).
  ble_ota:
    id: bth_ota
    key: !secret move_sensor_ble_ota_key
    min_battery: 30          # ниже — OTA отклоняется (флеш + радио на подсевшем LiPo)
    # Настройки, которые HA (move_sensor_ble_ota) меняет через то же окно, без сервисного режима.
    # Применяются как из сервисного режима: проверка min/max, сохранение во флеш, on_value.
    settings:
      detect_delay: detect_delay
      keep_time: keep_time
      climate_interval: climate_interval
      voltage_factor: vbat_factor
      led: debug_led_enable
      motion_window: motion_window
      climate_window: climate_window
      temp_offset: temp_offset
      hum_offset: hum_offset
      bat_capacity: bat_capacity      # 1.6.0: команда 0x15/0x16, пакет рекламы BTHome не меняется
      bat_low: bat_low_level
  trigger_based: true        # HA не помечает спящее устройство как unavailable
  # 2026-11-16 (v1.15.5): пакет в эфир ТОЛЬКО по send_state (id(bth).send_now). Раньше каждое
  # тихое пробуждение (фронт PIR, отправлять нечего) и каждое изменение значения уходили в эфир
  # с новым packet id: ~6800 пакетов в сутки вместо ~400 реальных отправок, лишняя батарея и строки в базе HA.
  send_on_change: false
  # Быстрая реклама: пакет каждые 20-30 мс, пока плата не спит. Приёмник слушает
  # эфир короткими окнами, редкие пакеты (раз в 1 с) в окно почти не попадают.
  min_interval: 20ms
  max_interval: 30ms
  retransmit_count: 0        # при такой частоте повторы не нужны
  # Мощность рекламы BTHome, dBm: -12 -9 -6 -3 0 3 6 9 (2026-11-15). До этого в NimBLE не
  # применялась вовсе. Датчик будет стоять за стеной — +9 (надёжность важнее). A/B у прокси
  # в коридоре: +9 -> медиана -59 dBm, 0 -> -73 dBm; экономия от 0 dBm ~1-2 % батареи.
  tx_power: 9
  sensors:
    - type: battery
      id: battery_pct
    - type: voltage
      id: vbat_tx              # 2026-11-16: сглаженное (среднее 10 замеров, шаг 0.03 В), не сырое vbat
    - type: temperature
      id: env_temp
    - type: humidity
      id: env_hum
    # Пакет: 10 (заголовок + packet id) + 11 (сенсоры) + 2 (occupancy) = 23 байта BTHome
    # + 8 байт свой блок (Manufacturer Specific Data 0xFFFF, set_custom_data) = 31 из 31.
    # Battery low убран 2026-11-16 (дублирует Battery %). Wake count с 2026-11-16 (v1.14.2) —
    # в своём блоке: wake uint16 LE, settings_rev uint8 (0 = ещё нет, будет в 1.15),
    # motion_count uint8 (свежие срабатывания PIR). BTHome-сущность «Count» в HA застынет.
    # Счётчики сбросов (brownout/panic/watchdog) в BTHome НЕ идут — их читает интеграция
    # move_sensor_ble_ota командой DIAG (components/bthome/ble_ota.*), 2026-11-14.
  binary_sensors:
    - type: occupancy
      id: occupancy

# ----------------------------------------------------------------- сенсоры
sensor:
  - platform: adc
    id: vbat
    name: "Voltage"
    icon: mdi:flash-triangle-outline
    pin: GPIO${vbat_gpio}
    attenuation: 12db
    samples: 64              # 2026-11-15: было 16 — делитель 2×1 МОм шумит, больше усреднения
    update_interval: never
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    filters:
      - lambda: "return x * id(vbat_factor).state;"
    on_value:
      then:
        - lambda: |-
            // Процент — по напряжению покоя (кривая LiPo, библиотека li_battery), а не линейно.
            if (ms::bat_phase == 0) return;   // замер до старта (восстановление Voltage factor) — мимо
            float v = x;
            if (ms::bat_phase == 1) {
              ms::bat_v_boot = v;             // без радио: это и есть покой
              // 2026-11-15: Voltage factor поменяли — историю пересчитать под новый коэффициент
              const float f = id(vbat_factor).state;
              if (ms::bat_factor_used > 0 && fabsf(f - ms::bat_factor_used) > 0.0005f)
                id(bat).rescale(f / ms::bat_factor_used);
              ms::bat_factor_used = f;
            } else if (!id(service_mode)) {
              // 2026-11-15: замер вне сервисного режима (смена Voltage factor по BLE) идёт под нагрузкой
              // BLE — в процент его не берём, новый коэффициент применится в следующем пробуждении
              ESP_LOGI("bat", "measured %.3f V under BLE load - not used for %%", x);
              return;
            } else {
              // под Wi-Fi: один раз меряем просадку относительно замера без радио
              if (ms::bat_sag < 0 && ms::bat_v_boot > 0) {
                float s = ms::bat_v_boot - v;
                ms::bat_sag = s < 0 ? 0 : (s > 0.15f ? 0.15f : s);
                ESP_LOGI("bat", "Wi-Fi sag %.3f V (no radio %.3f, Wi-Fi %.3f)", ms::bat_sag, ms::bat_v_boot, v);
              }
              if (ms::bat_sag > 0) v += ms::bat_sag;
            }
            // 1.5.0: процент, сглаживание, low / critical — библиотека li_battery (раньше здесь, 2026-11-15/16:
            // сглаживание 0.15, скачок вверх > 0.1 В = зарядка, без зарядки процент только падает,
            // среднее 10 замеров с шагом 0.03 В для пакета BTHome)
            const bool was_crit = ms::bat_crit;
            const int p = (int) id(bat).process_voltage(v);
            ms::bat_low = id(bat).is_low();
            ms::bat_crit = id(bat).is_critical();
            if (ms::bat_crit != was_crit)
              ESP_LOGW("bat", "critical battery %s (%.3f V rest)", ms::bat_crit ? "ON - PIR off, check every 6 h" : "OFF - recharged", id(bat).rest_voltage());
            ESP_LOGI("bat", "measured %.3f V -> rest %.3f V (avg %.3f) -> %d %%%s",
                     x, v, id(bat).rest_voltage(), p, ms::bat_low ? " LOW" : "");
            id(vbat_tx).publish_state(id(bat).report_voltage());
            id(battery_pct).publish_state(p);
            id(bth_ota).set_battery_percent(p);   // порог для BLE OTA
            id(vbat_rest).publish_state(id(bat).rest_voltage());

  # сырое напряжение на пине D0, БЕЗ пересчёта делителя (АЦП как есть) — для отладки.
  # Обновляется вместе с Voltage. Видно по API (сервисный режим), в BTHome не уходит.
  - platform: copy
    source_id: vbat
    name: "D0 raw voltage"
    icon: mdi:sine-wave
    entity_category: diagnostic   # v1.15: отладка калибровки, не данные
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 3
    filters:
      - lambda: "return x / id(vbat_factor).state;"

  # счётчики сбросов для Wi-Fi-канала (2026-11-15), как Brownout count / Crash count интеграции
  - platform: template
    id: brownout_count
    name: "Brownout count"
    icon: mdi:flash-alert
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
    lambda: "return (float) id(bth_ota).diag_brownout();"
  - platform: template
    id: crash_count
    name: "Crash count"
    icon: mdi:alert-octagon
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
    lambda: "return (float) id(bth_ota).diag_crash();"

  # напряжение покоя (сглаженное, с поправкой на просадку под Wi-Fi) — по нему считается Battery.
  # Только API/сайт (сервисный режим), в BTHome не уходит.
  # 2026-11-16: напряжение для пакета BTHome — среднее 10 замеров, новое только при изменении >= 0.03 В
  - platform: template
    id: vbat_tx
    internal: true
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    id: vbat_rest
    name: "Battery rest voltage"
    icon: mdi:battery-heart-variant
    unit_of_measurement: "V"
    device_class: voltage
    entity_category: diagnostic
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: battery_pct
    name: "Battery"
    icon: mdi:battery-high
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: never

  # v1.15: номер правки настроек (см. move_sensor_rtc.h) — для интеграции по Wi-Fi
  - platform: template
    id: settings_rev_sensor
    name: "Settings revision"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: wake_counter
    name: "Wake count"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never

  # ---- температура и влажность (SHT41). Опрос только вручную, через script climate_read:
  # при каждой отправке пакета (send_state) и раз в 5 с в сервисном режиме.
  # Измерение ~10 мс, во сне 0.08 мкА.
  # В сервисном режиме Wi-Fi греет плату — температура завышена на 1-3 °C, это нормально.
  # 2026-11-14: «Simulate climate» удалён — всегда реальный SHT41.
  - platform: sht4x
    id: sht
    address: 0x44
    precision: High
    heater_max_duty: 0.0     # встроенный нагреватель выключен
    update_interval: never
    # Поправки (2026-11-14): Temperature offset / Humidity offset (со знаком, меняются из HA по BLE).
    # Поправка температуры пересчитывает и влажность по точке росы (Магнус): водяного пара в воздухе
    # столько же, а при другой температуре относительная влажность другая. Потом + Humidity offset.
    temperature:
      id: sht_temp
      on_value:
        - lambda: |-
            float off = std::isnan(id(temp_offset).state) ? 0.0f : id(temp_offset).state;
            id(env_temp).publish_state(x + off);
    humidity:
      id: sht_hum
      on_value:
        - lambda: |-
            float t = id(sht_temp).state;
            float toff = std::isnan(id(temp_offset).state) ? 0.0f : id(temp_offset).state;
            float hoff = std::isnan(id(hum_offset).state) ? 0.0f : id(hum_offset).state;
            float rh = x;
            if (!std::isnan(t) && toff != 0.0f) {
              auto es = [](float c) { return 6.112f * expf(17.62f * c / (243.12f + c)); };
              rh = x * es(t) / es(t + toff);
            }
            rh += hoff;
            if (rh < 0.0f) rh = 0.0f;
            if (rh > 100.0f) rh = 100.0f;
            id(env_hum).publish_state(rh);

  # то, что уходит в BTHome и в API (значения SHT41)
  - platform: template
    id: env_temp
    name: "Temperature"
    icon: mdi:thermometer
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: env_hum
    name: "Humidity"
    icon: mdi:water-percent
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # ---- уровень сигнала: Wi-Fi (работает только в сервисном режиме)
  - platform: wifi_signal
    id: wifi_rssi
    name: "Wi-Fi RSSI"
    icon: mdi:wifi-strength-3
    update_interval: 10s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_rssi
    name: "Wi-Fi signal"
    icon: mdi:wifi
    unit_of_measurement: "%"
    device_class: ""
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      # как в остальных проектах: -90 dBm = 0 %, -30 dBm = 100 %
      - lambda: |-
          const float rssi_min = -90.0f;
          const float rssi_max = -30.0f;
          return clamp((x - rssi_min) * 100.0f / (rssi_max - rssi_min), 0.0f, 100.0f);

  # ---- уровень сигнала: Bluetooth
  # Свой BLE-сигнал датчик измерить не может (он только передаёт) — RSSI меряет
  # приёмник. Берём его из HA: сущность "Signal strength" устройства BTHome.
  # Обновляется только в сервисном режиме (нужен API). Имя сущности — в substitutions.
  - platform: homeassistant
    id: ble_rssi
    name: "BLE RSSI"
    icon: mdi:bluetooth-audio
    entity_id: ${ble_rssi_entity}
    unit_of_measurement: "dBm"
    device_class: signal_strength
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: copy
    source_id: ble_rssi
    name: "BLE Signal"
    icon: mdi:bluetooth
    unit_of_measurement: "%"
    device_class: ""
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      # как в остальных проектах: -90 dBm = 0 %, -30 dBm = 100 %
      - lambda: |-
          const float rssi_min = -90.0f;
          const float rssi_max = -30.0f;
          return clamp((x - rssi_min) * 100.0f / (rssi_max - rssi_min), 0.0f, 100.0f);

binary_sensor:
  # сырой сигнал PIR (выход SR602 до Detect delay / Keep time).
  # 2026-11-15: виден на сайте в разделе «Отладка» (для разбора ложных срабатываний);
  # в HA сущность по умолчанию выключена (disabled_by_default), чтобы не множить сенсоры.
  - platform: gpio
    id: pir_raw
    name: "PIR raw"
    icon: mdi:motion-sensor
    entity_category: diagnostic
    disabled_by_default: true
    pin:
      number: GPIO${pir_gpio}
      # allow_other_uses убран (2026-11-14): deep_sleep больше не держит D1 — сенсор снова на прерываниях
      mode:
        input: true
        pulldown: true
    on_press:
      - script.execute: motion_eval
    # PIR отпустил, пока плата не спит (например, в окне отправки) — Keep time с этого момента
    on_release:
      - lambda: |-
          ms::pir_low_seen = true;   // следующий подъём — свежее срабатывание (2026-11-16)
          if (ms::occupied && ms::keep_pending()) {
            ms::keep_start((int) id(keep_time).state);
            ESP_LOGI("ms", "pir released (awake), OFF in %d s", (int) id(keep_time).state);
          }

  # сервисная кнопка
  - platform: gpio
    id: service_btn
    internal: true
    pin:
      number: GPIO${service_gpio}
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on_off: 30ms
    # Переключатель с фиксацией: замкнут на 3V3 = сервисный режим, разомкнут = работа/сон.
    # Обрабатывается по УРОВНЮ в interval ниже (а не по on_press/on_release): если плата
    # проснулась или включилась с уже замкнутым переключателем, фронта нажатия нет.

  # итоговое состояние, которое уходит в BTHome и в API
  - platform: template
    id: occupancy
    name: "Occupancy"
    icon: mdi:motion-sensor
    device_class: occupancy

  # сервисный режим только для чтения: включается и выключается ТОЛЬКО переключателем SW2 (D2)
  - platform: template
    id: service_state
    name: "Service mode"
    icon: mdi:cog-transfer
    entity_category: diagnostic
    lambda: "return id(service_mode);"

# ------------------------------------------------- настройки (сервисный режим)
number:
  # Множитель делителя батареи: Voltage = напряжение на D0 × Voltage factor.
  # Подгонка: Voltage factor = U_тестера_на_BAT+ / "D0 raw voltage".
  - platform: template
    id: vbat_factor
    name: "Voltage factor"
    icon: mdi:division
    entity_category: config
    min_value: 1.5
    max_value: 2.5
    step: 0.001
    initial_value: ${vbat_divider}
    optimistic: true
    restore_value: true
    mode: box
    # v1.15: реальная правка (не восстановление) -> номер правки +1 (rev_commit)
    set_action:
      - lambda: "if (ms::boot_done && ms::setting_changed(x, id(vbat_factor).state)) ms::rev_pending = true;"
    on_value:
      - lambda: "id(vbat).update();"

  # 1.6.0: батарея — ёмкость и порог «низкого» заряда для li_battery. Меняются на сайте датчика /
  # в ESPHome (сервисный режим) и из HA по BLE (интеграция, команда 0x16). Во флеше.
  - platform: template
    id: bat_capacity
    name: "Battery capacity"
    icon: mdi:battery-plus-variant
    entity_category: config
    unit_of_measurement: mAh
    min_value: 100
    max_value: 5000
    step: 10
    initial_value: 920
    optimistic: true
    restore_value: true
    mode: box
    set_action:
      - lambda: "if (ms::boot_done && ms::setting_changed(x, id(bat_capacity).state)) ms::rev_pending = true;"

  - platform: template
    id: bat_low_level
    name: "Battery low level"
    icon: mdi:battery-low
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 50
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    mode: box
    set_action:
      - lambda: "if (ms::boot_done && ms::setting_changed(x, id(bat_low_level).state)) ms::rev_pending = true;"

  - platform: template
    id: detect_delay
    name: "Detect delay"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: ms
    min_value: 0
    max_value: 5000
    step: 50
    initial_value: 100
    optimistic: true
    restore_value: true
    mode: box
    # v1.15: реальная правка (не восстановление) -> номер правки +1 (rev_commit)
    set_action:
      - lambda: "if (ms::boot_done && ms::setting_changed(x, id(detect_delay).state)) ms::rev_pending = true;"

  - platform: template
    id: keep_time
    name: "Keep time"
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: s
    min_value: 5
    max_value: 600
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    mode: box
    # v1.15: реальная правка (не восстановление) -> номер правки +1 (rev_commit)
    set_action:
      - lambda: "if (ms::boot_done && ms::setting_changed(x, id(keep_time).state)) ms::rev_pending = true;"

  # Как часто просыпаться по таймеру и слать температуру/влажность, когда движения нет.
  # 0 = не просыпаться (данные уходят только вместе с событиями движения).
  # Каждое пробуждение = tx_window бодрствования, это главный расход батареи.
  - platform: template
    id: climate_interval
    name: "Climate report interval"
    icon: mdi:thermometer-lines
    entity_category: config
    unit_of_measurement: min
    min_value: 0
    max_value: 240
    step: 1
    initial_value: 5     # 2026-11-15: по умолчанию 5 мин (было 30)
    optimistic: true
    restore_value: true
    mode: box
    # v1.15: реальная правка (не восстановление) -> номер правки +1 (rev_commit)
    set_action:
      - lambda: "if (ms::boot_done && ms::setting_changed(x, id(climate_interval).state)) ms::rev_pending = true;"

  # Окна рекламы после пакета (2026-11-14), мс: сколько не спим, чтобы прокси услышал пакет
  # и интеграция успела подключиться (OTA/настройки). Пакет «движение/пусто» — Motion window,
  # климат и остальное — Climate window. Интеграция HA подбирает их сама по RSSI (Auto advertising
  # window) и шлёт по BLE. Замер: при RSSI −56 и прокси на настройках по умолчанию 0 потерь даже
  # при 300 мс. Было фиксированно ${tx_window}.
  - platform: template
    id: motion_window
    name: "Motion window"
    icon: mdi:broadcast
    entity_category: config
    unit_of_measurement: ms
    min_value: 300
    max_value: 5000
    step: 100
    initial_value: 1000
    optimistic: true
    restore_value: true
    mode: box
    # v1.15: реальная правка (не восстановление) -> номер правки +1 (rev_commit)
    set_action:
      - lambda: "if (ms::boot_done && ms::setting_changed(x, id(motion_window).state)) ms::rev_pending = true;"
  # Поправки SHT41 (2026-11-14): прибавляются к измерению, бывают и плюс, и минус. Меняются из HA
  # (move_sensor_ble_ota) по BLE или здесь в сервисном режиме; сохраняются во флеш.
  - platform: template
    id: temp_offset
    name: "Temperature offset"
    icon: mdi:thermometer-plus
    entity_category: config
    unit_of_measurement: "°C"
    min_value: -10
    max_value: 10
    step: 0.1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    # v1.15: реальная правка (не восстановление) -> номер правки +1 (rev_commit)
    set_action:
      - lambda: "if (ms::boot_done && ms::setting_changed(x, id(temp_offset).state)) ms::rev_pending = true;"
  - platform: template
    id: hum_offset
    name: "Humidity offset"
    icon: mdi:water-plus
    entity_category: config
    unit_of_measurement: "%"
    min_value: -20
    max_value: 20
    step: 0.1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    # v1.15: реальная правка (не восстановление) -> номер правки +1 (rev_commit)
    set_action:
      - lambda: "if (ms::boot_done && ms::setting_changed(x, id(hum_offset).state)) ms::rev_pending = true;"
  - platform: template
    id: climate_window
    name: "Climate window"
    icon: mdi:access-point
    entity_category: config
    unit_of_measurement: ms
    min_value: 300
    max_value: 5000
    step: 100
    initial_value: 2000
    optimistic: true
    restore_value: true
    mode: box
    # v1.15: реальная правка (не восстановление) -> номер правки +1 (rev_commit)
    set_action:
      - lambda: "if (ms::boot_done && ms::setting_changed(x, id(climate_window).state)) ms::rev_pending = true;"

output:
  - platform: gpio
    id: dbg_led
    pin: GPIO${led_gpio}

switch:
  - platform: template
    id: debug_led_enable
    name: "Motion tracking LED"   # LED только для отслеживания срабатываний
    icon: mdi:motion-sensor
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: "if (ms::boot_done) ms::rev_pending = true;"   # v1.15: правка -> номер правки +1
    on_turn_off:
      - output.turn_off: dbg_led
      - lambda: "if (ms::boot_done) ms::rev_pending = true;"

text_sensor:
  # Версии — как в остальных проектах (esphome-bluetooth-proxy.yaml): видно, какая прошивка
  # реально стоит (например, если OTA откатилась). Только API/веб (сервисный режим), в BTHome не идут.
  - platform: version
    name: "ESPHome Version"
    id: esphome_version_text
    hide_timestamp: true   # без "built ..." — время сборки уже в Build Version
    entity_category: diagnostic

  # Wi-Fi-канал (2026-11-15): то же, что интеграция HA получает по BLE (DIAG 0x09), с теми же
  # именами — где BLE нет, HA видит это по Wi-Fi (ESPHome). Строки как RESET_REASONS интеграции.
  - platform: template
    name: "Last reset reason"
    id: last_reset_reason_text
    icon: mdi:restart-alert
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      static const char *const R[] = {"unknown", "power on", "reset pin", "software", "panic",
          "watchdog (int)", "watchdog (task)", "watchdog", "deep sleep", "brownout", "sdio", "usb",
          "jtag", "efuse", "power glitch", "cpu lockup"};
      uint8_t r = id(bth_ota).diag_last();
      return {r < sizeof(R) / sizeof(R[0]) ? R[r] : "unknown"};

  # Device ID (2026-11-15) — хвост MAC Wi-Fi заглавными, напр. 148F98: он же в имени
  # move-sensor-ble-148f98, в SSID точки MoveSensorBLE-148F98 и в имени YAML датчика.
  # BT MAC = Wi-Fi MAC + 2 (интеграция HA считает тот же ID из BLE-адреса).
  - platform: template
    name: "Device ID"
    id: device_id_text
    icon: mdi:identifier
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      uint8_t mac[6];
      esp_read_mac(mac, ESP_MAC_WIFI_STA);
      char buf[8];
      snprintf(buf, sizeof(buf), "%02X%02X%02X", mac[3], mac[4], mac[5]);
      return {buf};

  # Номер сборки vГГГГ.ММ.ДД.ЧЧММСС — из времени сборки ESPHome (см. lambda).
  # Константа сборки: публикуется при входе в сервисный режим (script service_enter).
  - platform: template
    name: "Build Version"
    id: build_version_text
    icon: mdi:wrench
    entity_category: diagnostic
    update_interval: never
    # 2026-11-14: время сборки берём у ESPHome (App.get_build_time_string, обновляется при КАЖДОЙ
    # компиляции, местное время с поясом). __DATE__/__TIME__ в main.cpp меняется только когда меняется
    # сам main.cpp — правка одного .cpp компонента (ble_ota.cpp) оставляла старую версию.
    lambda: |-
      char bt[Application::BUILD_TIME_STR_SIZE];   // "2026-11-14 03:43:46 +0200"
      App.get_build_time_string(bt);
      int year = 0, month = 0, day = 0, hh = 0, mm = 0, ss = 0;
      sscanf(bt, "%d-%d-%d %d:%d:%d", &year, &month, &day, &hh, &mm, &ss);
      // + 8 hex SHA-256 образа (2026-11-14): время сборки ESPHome меняется только при правке YAML,
      // а правка .h/.cpp (компоненты, includes) давала тот же номер — теперь версия уникальна всегда
      const uint8_t *sha = esp_app_get_description()->app_elf_sha256;
      // 1.4.0: версия прошивки — первой («1.4.0 v2026.11.16.171328-078195f0»): ответ INFO по BLE
      // обрезается по MTU, при обрезке теряется хвост, а версия остаётся
      // 2026-11-19: + « t<отпечаток файлов прошивки>» (components/bthome/__init__.py) — по нему
      // интеграция HA точно знает, из каких файлов собрана прошивка, кто бы её ни ставил
      #ifndef BUILD_TREE_FP
      #define BUILD_TREE_FP "--------"
      #endif
      char buf[72];
      // отпечаток — сразу за версией: ответ INFO по BLE при малом MTU обрезает хвост
      snprintf(buf, sizeof(buf), "%s t%s v%04d.%02d.%02d.%02d%02d%02d-%02x%02x%02x%02x", "${fw_version}",
               BUILD_TREE_FP, year, month, day, hh, mm, ss, sha[0], sha[1], sha[2], sha[3]);
      return {std::string(buf)};

  - platform: template
    id: wake_reason
    name: "Wake reason"
    icon: mdi:sleep-off
    entity_category: diagnostic
    update_interval: never

# в сервисном режиме шлём свежий пакет каждые 5 с -> в HA обновляется RSSI
interval:
  # v1.15: правка настройки (сайт / ESPHome API) -> номер правки +1, сразу во флеш
  - interval: 200ms
    then:
      - lambda: "if (ms::rev_pending) id(bth_ota).rev_commit();"
  # 1.4.3: таймаута сервисного режима нет (убран; с 1.4.1 был выключен) — Wi-Fi держится, пока включён переключатель
  # сервисный переключатель: следим за уровнем на D2
  - interval: 200ms
    then:
      - lambda: |-
          // 2026-11-15 (ревью): пока фильтр delayed_on_off (30 мс) не выдал первое состояние,
          // state = false -> интервал «выходил» из сервисного режима, в который boot_dispatch
          // только что вошёл по уровню пина, и тут же входил снова: одно включение считалось
          // дважды в счётчике заводского сброса. Ждём первого состояния.
          if (!id(service_btn).has_state()) return;
          const bool sw = id(service_btn).state;
          if (sw && !id(service_by_switch)) {
            id(service_by_switch) = true;
            id(service_enter).execute();
          } else if (!sw && id(service_by_switch)) {
            id(service_by_switch) = false;
            id(service_exit).execute();
          }
  - interval: 5s
    then:
      - if:
          condition:
            lambda: "return id(service_mode);"
          then:
            - lambda: |-
                id(vbat).update();
                id(climate_read).execute();
                id(wake_counter).publish_state(ms::wake_count & 0x3FFF);
                id(custom_data_update).execute();
                id(bth).send_now(80);   // 2026-11-16: в сервисном режиме — пакет раз в 5 с

# ------------------------------------------------------------------ логика
script:
  # Что нас разбудило и в каком режиме работаем
  - id: boot_dispatch
    then:
      - lambda: |-
          ms::wake_count++;
          auto cause = esp_sleep_get_wakeup_cause();
          uint64_t pins = esp_sleep_get_gpio_wakeup_status();
          bool by_service = (cause == ESP_SLEEP_WAKEUP_GPIO) && (pins & (1ULL << ${service_gpio}));
          const char *why = "cold boot";
          // не от сна — уточняем причину сброса (только текст для Wake reason; счётчики
          // по причинам ведёт ble_ota в NVS и отдаёт интеграции по DIAG)
          if (cause == ESP_SLEEP_WAKEUP_UNDEFINED) {
            const esp_reset_reason_t rr = esp_reset_reason();
            switch (rr) {
              case ESP_RST_POWERON:  why = "power on"; break;
              case ESP_RST_BROWNOUT: why = "brownout"; break;
              case ESP_RST_SW:       why = "software reset"; break;   // OTA, restart
              case ESP_RST_PANIC:    why = "panic"; break;
              case ESP_RST_INT_WDT:
              case ESP_RST_TASK_WDT:
              case ESP_RST_WDT:      why = "watchdog"; break;
              case ESP_RST_EXT:      why = "reset pin"; break;
              default:               why = "cold boot"; break;
            }
            ESP_LOGI("ms", "reset reason: %s (%d)", why, (int) rr);
          }
          if (cause == ESP_SLEEP_WAKEUP_TIMER) why = "timer";
          else if (by_service) why = "service button";
          else if (cause == ESP_SLEEP_WAKEUP_GPIO) why = "pir";
          ESP_LOGI("ms", "wake #%u: %s (cause=%d pins=0x%02x) occupied=%d held=%d remaining=%lld ms",
                   (unsigned) ms::wake_count, why, (int) cause, (unsigned) pins,
                   ms::occupied, ms::pir_held,
                   (ms::occupied && !ms::keep_pending()) ? (long long) ms::remaining_ms() : -1LL);
          id(wake_reason).publish_state(why);
          // 2026-11-15: проснулись, а «занято» ещё держится (RTC) — восстановить состояние сущности.
          // Иначе после сна Occupancy без значения: BTHome не кладёт её в пакеты, сайт и ESPHome
          // показывают «нет движения», хотя датчик считает «занято» и ждёт Keep time.
          if (cause != ESP_SLEEP_WAKEUP_UNDEFINED && ms::occupied && !id(occupancy).has_state())
            id(occupancy).publish_state(true);
          // Короткий импульс (кнопка, короткий PIR) успевает закончиться, пока плата
          // грузится (~0.3-0.5 с). Поэтому пробуждение от PIR-пина считаем движением,
          // даже если к этому моменту на пине уже LOW.
          // Исключение (2026-11-14): если спали, ожидая отпускания PIR (pir_held), пробуждение
          // по D1 — это отпускание (LOW), а не новое движение. Если к этому моменту на D1 снова
          // HIGH — motion_eval увидит уровень и посчитает это повторным движением.
          id(woke_by_pir) = (cause == ESP_SLEEP_WAKEUP_GPIO) && !by_service && !ms::pir_held;
          // свежее срабатывание (2026-11-16): проснулись от фронта PIR — до него был LOW;
          // на пине сейчас LOW — следующий подъём будет новым фронтом
          if (id(woke_by_pir) || gpio_get_level((gpio_num_t) ${pir_gpio}) == 0) ms::pir_low_seen = true;
          ms::pir_held = false;   // решается заново перед следующим сном (go_sleep)
          // Сервисный режим задаёт только переключатель на D2 — и при пробуждении, и при
          // холодном старте (после потери питания). Уровень читаем прямо с пина: фильтр
          // binary_sensor к этому моменту ещё не отработал. Выключен -> Wi-Fi не поднимаем.
          const bool sw_on = gpio_get_level((gpio_num_t) ${service_gpio}) != 0;
          if (by_service || sw_on) {
            id(service_by_switch) = true;
            id(service_enter).execute();
          }
      - script.execute: motion_eval

  # Оценка движения. Перезапускается каждым новым фронтом PIR.
  - id: motion_eval
    mode: restart
    then:
      - script.stop: go_sleep
      # PIR отпустил во сне / пока грузились (фронта on_release не было) — Keep time с этого момента
      - lambda: |-
          if (gpio_get_level((gpio_num_t) ${pir_gpio}) == 0) ms::pir_low_seen = true;
          if (ms::occupied && ms::keep_pending() && gpio_get_level((gpio_num_t) ${pir_gpio}) == 0) {
            ms::keep_start((int) id(keep_time).state);
            ESP_LOGI("ms", "pir released, OFF in %d s", (int) id(keep_time).state);
          }
      - if:
          condition:
            lambda: "return id(woke_by_pir) || id(pir_raw).state;"
          then:
            # задержка на детект: сигнал должен продержаться detect_delay.
            # 2026-11-15 (ревью): и после пробуждения от PIR тоже (раньше пропускалась, и настройка
            # во сне не работала). Время загрузки засчитывается: ждём только остаток detect_delay.
            # Если остаток есть — движение засчитаем, только если PIR к его концу ещё держит HIGH.
            - if:
                condition:
                  lambda: "return !id(woke_by_pir);"
                then:
                  - delay: !lambda "return (uint32_t) id(detect_delay).state;"
                else:
                  - delay: !lambda |-
                      const uint32_t d = (uint32_t) id(detect_delay).state, up = millis();
                      if (d <= up) return 0;   // задержка прошла, пока грузились — движение засчитано
                      id(woke_by_pir) = false; // дальше решает уровень PIR (pir_raw)
                      ESP_LOGD("ms", "woke by PIR: detect delay, waiting %u ms more", (unsigned) (d - up));
                      return d - up;
            - if:
                condition:
                  lambda: "return id(woke_by_pir) || id(pir_raw).state;"
                then:
                  - lambda: |-
                      id(woke_by_pir) = false;
                      ms::off_repeat_ms = 0;   // новое движение — повтор OFF не нужен
                      const bool fresh = ms::motion_fresh_take();   // 2026-11-16
                      if (!ms::occupied) {
                        ms::occupied = true;
                        ESP_LOGI("ms", "motion confirmed -> ON (fresh=%d, motion #%u)", fresh, (unsigned) ms::motion_count);
                        id(send_state).execute(true, true);
                      } else if (fresh && !id(tx_pending) &&
                                 ms::now_ms() - ms::motion_tx_ms >= ms::MOTION_REFRESH_MS) {
                        // «занято» держится, человек шевелится: пакет не чаще раза в 2 мин,
                        // без мигания, окно — Motion window (2026-11-16)
                        ESP_LOGI("ms", "motion again (motion #%u), keep time restarted -> refresh sent",
                                 (unsigned) ms::motion_count);
                        id(send_state).execute(true, false);
                        id(tx_motion) = true;
                      } else {
                        ESP_LOGI("ms", "motion again (fresh=%d, motion #%u), keep time restarted",
                                 fresh, (unsigned) ms::motion_count);
                      }
                  # Keep time считается с отпускания PIR. Рабочий режим: НЕ ждём отпускания
                  # бодрствуя — ставим «ждём» (KEEP_PENDING), go_sleep уснёт с пробуждением по LOW.
                  # Сервисный режим (не спит): ждём, как раньше.
                  - lambda: |-
                      if (gpio_get_level((gpio_num_t) ${pir_gpio}) == 0) {
                        ms::keep_start((int) id(keep_time).state);
                        ESP_LOGI("ms", "pir already released, OFF in %d s", (int) id(keep_time).state);
                      } else {
                        ms::off_deadline_ms = ms::KEEP_PENDING;
                      }
                  - if:
                      condition:
                        lambda: "return id(service_mode) && ms::keep_pending();"
                      then:
                        - wait_until:
                            condition:
                              lambda: "return !id(pir_raw).state;"
                            timeout: 10min
                        - lambda: |-
                            ms::keep_start((int) id(keep_time).state);
                            ESP_LOGI("ms", "pir released, OFF in %d s", (int) id(keep_time).state);
                else:
                  - logger.log: "pulse shorter than detect delay - ignored"
      - if:
          condition:
            lambda: "return ms::occupied;"
          then:
            # в сервисном режиме не спим, а просто ждём дедлайн
            - if:
                condition:
                  lambda: "return id(service_mode) && !ms::keep_pending() && ms::remaining_ms() > 0;"
                then:
                  - delay: !lambda "return (uint32_t) ms::remaining_ms();"
            - if:
                condition:
                  lambda: "return !ms::keep_pending() && ms::remaining_ms() <= 0;"
                then:
                  - lambda: |-
                      ms::occupied = false;
                      ESP_LOGI("ms", "keep time elapsed -> OFF");
                      id(send_state).execute(false, true);
                      ms::off_repeat_ms = ms::now_ms() + ms::OFF_REPEAT_MS;   // повтор OFF через 60 с
          else:
            # после холодного старта / пробуждения по таймеру климата сообщаем "чисто",
            # но БЕЗ мигания: это не событие движения
            - if:
                condition:
                  lambda: "return !id(occupancy).has_state();"
                then:
                  - lambda: "id(send_state).execute(false, false);"
      # пакета в этом пробуждении нет (например «motion again» при занято), а срок отчёта
      # о климате прошёл — шлём текущее состояние + климат, без мигания (2026-11-14)
      - lambda: |-
          // повтор «свободно» (2026-11-15): срок пришёл — шлём состояние ещё раз, без мигания
          if (!id(tx_pending) && !ms::occupied && ms::off_repeat_ms != 0 &&
              ms::now_ms() >= ms::off_repeat_ms - 2000) {
            ms::off_repeat_ms = 0;
            ESP_LOGI("ms", "OFF repeat -> send");
            id(send_state).execute(false, false);
          }
          if (!id(tx_pending) && ms::climate_due(ms::climate_interval_ms(id(climate_interval).state))) {
            ESP_LOGI("ms", "climate report due -> send (occupied=%d)", ms::occupied);
            if (!ms::occupied) ms::off_repeat_ms = 0;   // «свободно» уходит и в климат-пакете
            id(send_state).execute(ms::occupied, false);
          }
      - script.execute: go_sleep

  # Опрос температуры/влажности (SHT41)
  - id: climate_read
    then:
      - component.update: sht

  # Свой блок рекламы (2026-11-16): wake uint16 LE, settings_rev, motion_count (после BTHome, 0xFFFF)
  - id: custom_data_update
    then:
      - lambda: |-
          // 1.7.0 (2026-11-19): два старших бита поля wake — флаги для HA, счётчик 14 бит (по кругу):
          // bit15 — сервисный режим, bit14 — подключён к роутеру. По ним HA видит «Wi-Fi включён»,
          // даже когда по Wi-Fi датчик недоступен (другая сеть / только своя точка доступа).
          // В пакет BTHome лишний байт не влезает (31 байт) — поэтому флаги в этом поле.
          uint16_t w = ms::wake_count & 0x3FFF;
          if (id(service_mode)) w |= 0x8000;
          if (id(service_mode) && wifi::global_wifi_component->is_connected()) w |= 0x4000;
          const uint8_t cd[4] = {(uint8_t) (w & 0xFF), (uint8_t) (w >> 8), ms::settings_rev, ms::motion_count};
          id(bth).set_custom_data(0xFFFF, cd, sizeof(cd));

  # Публикация состояния: один BTHome-пакет со всем сразу
  - id: send_state
    parameters:
      state: bool
      led: bool     # реальное событие (занято / освободилось): длинное окно рекламы; мигаем только на «занято»
    then:
      - lambda: |-
          // батарею в рабочем режиме меряем только на старте (до радио, on_boot 550):
          // под BLE-рекламой напряжение проседает. В сервисном — меряем и тут (с поправкой).
          if (id(service_mode)) id(vbat).update();
          // SHT41 отвечает через ~10 мс,
          // значения попадут в пакет в пределах tx_window
          id(climate_read).execute();
          ms::climate_last_ms = ms::now_ms();   // климат уходит в этом пакете
          id(wake_counter).publish_state(ms::wake_count & 0x3FFF);
          id(custom_data_update).execute();   // свой блок рекламы: wake, settings_rev, motion_count
          if (state) ms::motion_tx_ms = ms::now_ms();
          // повтор «свободно» (2026-11-15): любой пакет со «свободно» его выполняет. Флаг ставит
          // ветка keep time ПОСЛЕ этого вызова — сама её отправка его не сбрасывает.
          if (!state) ms::off_repeat_ms = 0;
          id(occupancy).publish_state(state);
          id(tx_pending) = true;
          if (led) id(tx_motion) = true;   // led = реальное событие (занято / освободилось)
          // 1.4.2: мигаем только на «занято» (новое движение); на «освободилось» — нет,
          // как у серийных датчиков (Shelly BLU Motion, Aqara P1, Hue)
          if (led && state) id(blink).execute(1);
          // 2026-11-16: собрать пакет через 80 мс — SHT41 (~10 мс) и остальные значения уже в нём
          id(bth).send_now(80);

  # Уход в сон (в сервисном режиме ничего не делает)
  - id: go_sleep
    mode: restart
    then:
      # новое окно (перезапуск движением) — снова принимаем BLE-подключения (OTA/настройки)
      - lambda: "id(bth_ota).sleep_unlock();"
      - if:
          condition:
            lambda: "return !id(service_mode);"
          then:
            - if:
                condition:
                  lambda: "return id(tx_pending);"
                then:
                  # Motion/Climate window (настройки, их подбирает интеграция); в быстром тесте —
                  # окно из команды TEST_MODE (замер окна для прокси)
                  - delay: !lambda |-
                      float w = id(tx_motion) ? id(motion_window).state : id(climate_window).state;
                      uint32_t def_ms = std::isnan(w) ? ${tx_window_ms} : (uint32_t) w;
                      return ms::tx_window_ms(def_ms);
                  - lambda: "id(tx_pending) = false; id(tx_motion) = false;"
            # после загрузки НЕ от сна (питание, ресет, OTA) не засыпаем раньше 15 с аптайма,
            # чтобы safe_mode успел подтвердить прошивку (boot_is_good_after: 15s).
            # Пробуждения от PIR/таймера сюда не попадают — батарея не тратится.
            - if:
                condition:
                  lambda: "return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_UNDEFINED && millis() < 15000;"
                then:
                  - logger.log:
                      format: "cold boot: hold sleep %u ms for safe_mode"
                      args: ["(unsigned) (15000 - millis())"]
                  - delay: !lambda "return 15000 - millis();"
            # сервисный переключатель будит по HIGH — засыпать, пока он HIGH, нельзя.
            # PIR больше не ждём (2026-11-14): при HIGH на D1 спим с пробуждением по LOW.
            - wait_until:
                condition:
                  lambda: "return !id(service_btn).state;"
                timeout: 30s
            # BLE OTA/настройки — защёлка ПРЯМО перед сном (2026-11-14): реклама становится
            # неподключаемой, ждём 300 мс, не успел ли клиент подключиться; подключён — не спим,
            # пока не отключится (OTA закончится перезагрузкой). Раньше проверка была до ожидания
            # PIR и клиент успевал подключиться между проверкой и сном — датчик засыпал посреди OTA.
            # 2026-11-15: было «timeout: 15min» — на слабом сигнале прошивка (~1.3 МБ) может идти
            # дольше, и датчик засыпал посреди OTA (прошивка с нуля + лишний расход батареи).
            # Теперь ждём, пока клиент работает; засыпаем раньше, только если он завис
            # (нет активности 2 мин; компонент и сам рвёт такое подключение через 30-60 с).
            # 60 мин — последняя страховка (это < 400 Б/с, такой связи не бывает).
            - wait_until:
                condition:
                  lambda: |-
                    if (id(bth_ota).sleep_ready()) return true;
                    const uint32_t idle = id(bth_ota).activity_idle_ms();
                    if (idle > 120000) {
                      ESP_LOGW("ms", "BLE client stalled %u s - sleeping anyway", (unsigned) (idle / 1000));
                      return true;
                    }
                    return false;
                timeout: 60min
            # Identify (2026-11-15): пока мигаем — не спим; после защёлки: команда приходит во время подключения (иначе LED замрёт посреди серии)
            - wait_until:
                condition:
                  lambda: "return id(identify_left) <= 0;"
                timeout: 65s
            - lambda: |-
                // сервисный переключатель (D2) будит по HIGH
                esp_deep_sleep_enable_gpio_wakeup(1ULL << ${service_gpio}, ESP_GPIO_WAKEUP_GPIO_HIGH);
                // PIR (D1): ОДИН замер уровня -> и уровень пробуждения, и флаг pir_held.
                // HIGH -> будить по LOW (отпускание), LOW -> будить по HIGH (новое движение).
                // Подтяжку на время сна IDF ставит сам по уровню (LOW-wake -> pull-up), SR602
                // выход push-pull через R1 1 кОм, так что подтяжка его не перебивает.
                // 1.4.0: критический разряд — PIR не будит (см. ms::bat_crit), только таймер проверки и переключатель
                if (ms::bat_crit) {
                  ms::pir_held = false;
                } else {
                  const bool pir_high = gpio_get_level((gpio_num_t) ${pir_gpio}) != 0;
                  ms::pir_held = pir_high;
                  if (!pir_high && ms::occupied && ms::keep_pending()) {
                    ms::keep_start((int) id(keep_time).state);   // отпустил прямо перед сном
                    ESP_LOGI("ms", "pir released before sleep, OFF in %d s", (int) id(keep_time).state);
                  }
                  esp_deep_sleep_enable_gpio_wakeup(1ULL << ${pir_gpio},
                      pir_high ? ESP_GPIO_WAKEUP_GPIO_LOW : ESP_GPIO_WAKEUP_GPIO_HIGH);
                }
                // LED во сне: без удержания пин D10 не управляется и LED может светиться
                // весь сон. Фиксируем LOW и держим до пробуждения (снимается в on_boot).
                id(dbg_led).turn_off();
                ESP_LOGI("led", "OFF + hold before deep sleep");
                gpio_set_level((gpio_num_t) ${led_gpio}, 0);
                gpio_hold_en((gpio_num_t) ${led_gpio});
                #if SOC_GPIO_SUPPORT_HOLD_IO_IN_DSLP && !SOC_GPIO_SUPPORT_HOLD_SINGLE_IO_IN_DSLP
                gpio_deep_sleep_hold_en();
                #endif
            # 1.4.0: критический разряд — спим BAT_CRIT_CHECK_MS (6 ч), на проверке пакет с батареей;
            # подзарядили (покой >= 3.65 В, li_battery resume) — снова обычная работа. Будит и сервисный переключатель.
            - if:
                condition:
                  lambda: "return ms::bat_crit;"
                then:
                  - logger.log:
                      level: WARN
                      format: "critical battery: sleep %u h, PIR wake off"
                      args: ["(unsigned) (ms::BAT_CRIT_CHECK_MS / 3600000UL)"]
                  - deep_sleep.enter:
                      id: ds
                      sleep_duration: !lambda "return ms::BAT_CRIT_CHECK_MS;"
            - if:
                condition:
                  lambda: "return ms::pir_held;"
                then:
                  # PIR держит HIGH: спим до отпускания; страховочный таймер — если PIR залип
                  - logger.log:
                      format: "sleep until PIR release (wake on LOW), safety timer %u s"
                      args: ["(unsigned) (ms::HELD_SAFETY_MS / 1000)"]
                  - deep_sleep.enter:
                      id: ds
                      sleep_duration: !lambda "return ms::cap_sleep_ms(ms::HELD_SAFETY_MS, ms::climate_interval_ms(id(climate_interval).state));"
                else:
                  - if:
                      condition:
                        lambda: "return ms::occupied;"
                      then:
                        - logger.log:
                            format: "sleep, timer wake in %lld ms"
                            args: ["(long long) ms::remaining_ms()"]
                        - deep_sleep.enter:
                            id: ds
                            sleep_duration: !lambda |-
                              int64_t r = ms::remaining_ms();
                              if (r < 100) r = 100;
                              // не дольше срока отчёта о климате (иначе при частых «motion again» климат стоит)
                              int64_t c = ms::climate_left_ms(ms::climate_interval_ms(id(climate_interval).state));
                              if (c < r) r = c < 1000 ? 1000 : c;
                              return (uint32_t) r;
                      else:
                        # движения нет: спим до PIR, но не дольше Climate report interval —
                        # по таймеру проснёмся и отправим температуру/влажность
                        - if:
                            condition:
                              lambda: "return id(climate_interval).state >= 1.0f || ms::test_mode() || ms::off_repeat_ms != 0;"
                            then:
                              - logger.log:
                                  format: "sleep until motion, climate report in %.0f min%s%s"
                                  args: ["id(climate_interval).state", "ms::test_mode() ? \" (FAST TEST: 30 s)\" : \"\"", "ms::off_repeat_ms ? \", OFF repeat pending\" : \"\""]
                              - deep_sleep.enter:
                                  id: ds
                                  sleep_duration: !lambda |-
                                    // 1.4.0: через climate_interval_ms — быстрый тест и «батарея разряжена» (реже) там же
                                    const uint32_t ci = ms::climate_interval_ms(id(climate_interval).state);
                                    uint32_t d = ci ? ci : UINT32_MAX;
                                    // повтор «свободно» (2026-11-15): проснуться не позже его срока
                                    if (ms::off_repeat_ms != 0) {
                                      int64_t r = ms::off_repeat_ms - ms::now_ms();
                                      if (r < 1000) r = 1000;
                                      if (r < (int64_t) d) d = (uint32_t) r;
                                    }
                                    return d;
                            else:
                              - logger.log: "sleep until motion"
                              - deep_sleep.enter:
                                  id: ds

  - id: service_enter
    then:
      - lambda: |-
          id(service_mode) = true;
          // счётчик включений переключателя для сброса Wi-Fi (RTC, переживает сон)
          const int64_t now = ms::now_ms();
          if (ms::svc_on_count == 0 || now - ms::svc_first_ms > ${wifi_reset_window_ms}) {
            ms::svc_first_ms = now;
            ms::svc_on_count = 0;
          }
          ms::svc_on_count++;
          ESP_LOGI("ms", "service mode ON (switch on #%u of ${wifi_reset_toggles} for factory reset)",
                   (unsigned) ms::svc_on_count);
          if (ms::svc_on_count >= ${wifi_reset_toggles}) {
            ms::svc_on_count = 0;
            id(wifi_reset_pending) = true;   // LED: 6 быстрых (factory_reset_net)
          } else if (!id(wifi_reset_pending)) {
            // LED (2026-11-15): 1-е включение — 3 медленные вспышки «сервисный режим»;
            // 2-е (до wifi_reset_toggles-1) за 10 с — столько же коротких вспышек, сколько включений засчитано.
            // Ждёт сброс из HA (BLE) — не мигаем: сейчас будут 6 быстрых, без каши из серий.
            id(service_blink).execute((int) ms::svc_on_count);
          }
      - component.update: build_version_text
      - component.update: device_id_text
      - component.update: last_reset_reason_text
      - component.update: brownout_count
      - component.update: crash_count
      - component.update: ap_password_mode
      - logger.set_level: DEBUG
      - script.stop: go_sleep
      - wifi.enable:
      - if:
          condition:
            lambda: "return id(wifi_reset_pending);"
          then:
            - delay: 1s     # дать wifi стартовать после enable
            - script.execute: factory_reset_net

  # Заводской сброс сети (2026-11-15): сеть роутера -> из прошивки (без отката), пароль своей
  # точки доступа -> заводской (fw_ap_password, он же на наклейке). Остальные настройки
  # (Keep time и т.д.) не трогает — их присылает HA. Запуск: 3 включения SW2 за 10 с
  # (service_enter) или команда сброса по BLE из HA. LED: 6 быстрых вспышек.
  - id: factory_reset_net
    then:
      - lambda: |-
          id(wifi_reset_pending) = false;
          id(ap_password_custom) = "";
          ESP_LOGW("ms", "FACTORY RESET: Wi-Fi -> firmware network, AP password -> default");
          // пишет в NVS и сразу подключается к сети из прошивки; точка доступа остаётся,
          // но с заводским паролем (ap_portal: из wifi: ap:) — подключённые к ней клиенты отключатся
          wifi::global_wifi_component->save_wifi_sta("${fw_wifi_ssid}", "${fw_wifi_password}");
          id(portal).reset_password();
      - component.update: ap_password_mode
      - script.execute: wifi_reset_blink
      - delay: 200ms        # globals успевают записать новое значение в NVS-очередь
      - lambda: "global_preferences->sync();"
      # 2026-11-15: пароль точки на лету не применялся — перезагрузка (WiFi включён -> снова сервисный режим)
      - delay: 1500ms       # дать досветить 6 вспышек
      - lambda: |-
          ESP_LOGW("ms", "FACTORY RESET: rebooting to apply AP password");
          App.safe_reboot();

  - id: service_exit
    then:
      - lambda: |-
          id(service_mode) = false;
          ESP_LOGI("ms", "service mode OFF");
          // v1.15.3: сказать HA «ухожу» (DisconnectRequest), иначе HA ждёт таймаут ~1,5 мин и
          // держит Link = Wi-Fi. Сокет сервера не закрываем (on_shutdown закрыл бы его до перезагрузки).
          for (auto &c : api::global_api_server->active_clients()) {
            api::DisconnectRequest req;
            if (!c->send_message(req)) ESP_LOGW("ms", "API disconnect not sent");
          }
      - delay: 500ms
      - logger.set_level: INFO
      - wifi.disable:
      # ревью 2026-11-19: пакет с уже снятыми флагами (bit15 сервис / bit14 роутер) — иначе HA
      # до следующего пакета считает Wi-Fi включённым; send_state ставит tx_pending -> окно рекламы
      - lambda: "id(send_state).execute(ms::occupied, false);"
      - script.execute: motion_eval

  # индикатор срабатываний: count коротких вспышек (только если включён Motion tracking LED)
  # подтверждение сброса Wi-Fi: 6 быстрых вспышек, даже если Motion tracking LED выключен
  # Identify (2026-11-15): быстрые вспышки, чтобы найти нужный датчик из нескольких.
  # Не зависит от «Motion tracking LED».
  - id: identify_blink
    mode: restart
    then:
      - while:
          condition:
            lambda: "return id(identify_left) > 0;"
          then:
            - output.turn_on: dbg_led
            - delay: 150ms
            - output.turn_off: dbg_led
            - delay: 350ms
            - lambda: "id(identify_left)--;"
  # Сервисный режим (2026-11-15), всегда, как подтверждения сброса и Identify:
  # n = 1 — 3 медленные вспышки (WiFi включён); n >= 2 — n коротких (счёт к заводскому сбросу; при 3 из 3 — сброс).
  # Дальше LED снова только для срабатываний (постоянно не горит).
  - id: service_blink
    mode: restart
    parameters:
      n: int
    then:
      - lambda: 'ESP_LOGI("led", "service blink: %s", n <= 1 ? "3 slow (service mode)" : "count to factory reset");'
      - output.turn_off: dbg_led
      - delay: 300ms
      - repeat:
          count: !lambda "return n <= 1 ? 3 : n;"
          then:
            - output.turn_on: dbg_led
            - delay: !lambda "return n <= 1 ? 500 : 120;"
            - output.turn_off: dbg_led
            - delay: !lambda "return n <= 1 ? 500 : 250;"

  - id: wifi_reset_blink
    then:
      - repeat:
          count: 6
          then:
            - output.turn_on: dbg_led
            - delay: 80ms
            - output.turn_off: dbg_led
            - delay: 120ms

  - id: blink
    mode: restart
    parameters:
      count: int
    then:
      - if:
          condition:
            # 1.4.0: батарея разряжена — LED срабатываний не тратит её (в сервисном режиме мигает)
            lambda: "return id(debug_led_enable).state && (!ms::bat_low || id(service_mode));"
          then:
            # пауза в темноте перед вспышками, чтобы серию было легко сосчитать
            - lambda: |-
                ESP_LOGI("led", "blink start: %d flash(es) [%s], service=%d",
                         count, count == 1 ? "occupied" : "clear", (int) id(service_mode));
            - output.turn_off: dbg_led
            - lambda: 'ESP_LOGD("led", "OFF (pause 400 ms)");'
            - delay: 400ms
            - repeat:
                count: !lambda "return count;"
                then:
                  - output.turn_on: dbg_led
                  - lambda: 'ESP_LOGI("led", "flash ON");'
                  - delay: 150ms
                  - output.turn_off: dbg_led
                  - lambda: 'ESP_LOGD("led", "flash OFF");'
                  - delay: 250ms
            - delay: 300ms
            - lambda: 'ESP_LOGI("led", "blink done");'
