# Wi-Fi датчика для HA (1.7.0). Сеть роутера, поиск сетей и пароль своей точки доступа теперь
# меняются в попапе библиотеки ap_portal («Wi-Fi роутера» на сайте датчика и в окне «Войти в сеть»),
# поэтому прежние поля New Wi-Fi SSID/password, New AP password и кнопки Reconnect / Scan /
# Save AP password убраны. Работает только в сервисном режиме (в рабочем Wi-Fi выключен).
# Заводской сброс без сайта — 3 включения сервисного переключателя за 10 с
# (move_sensor_ble/base.yaml, service_enter -> factory_reset_net): сеть из прошивки + заводской пароль точки.

text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_ssid_now
      name: "Wi-Fi SSID"
      icon: "mdi:wifi"
      entity_category: diagnostic
    ip_address:
      id: wifi_ip
      name: "Wi-Fi IP"
      icon: "mdi:ip-network"
      entity_category: diagnostic
  # какой пароль у своей точки сейчас: default (заводской, на наклейке) / custom (задан с сайта)
  - platform: template
    id: ap_password_mode
    name: "AP password"
    icon: "mdi:access-point-network"
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return {id(portal).has_custom_password() ? "custom" : "default"};'

button:
  # Жёсткий сброс: NVS снова на сеть из прошивки (secrets.yaml), и после перезагрузки тоже.
  - platform: template
    name: "Reset Wi-Fi to firmware defaults"
    id: reset_wifi_to_firmware
    icon: "mdi:backup-restore"
    entity_category: diagnostic
    on_press:
      - wifi.configure:
          ssid: !secret wifi_ssid
          password: !secret wifi_password
          save: true
          timeout: 20s
          on_connect:
            - logger.log: "reset_wifi_to_firmware: back on firmware network"
          on_error:
            - logger.log:
                format: "reset_wifi_to_firmware: firmware network failed - rolled back"
                level: WARN
