# Настройка домашней сети с сайта датчика (2026-11-11) — копия esp32_c3_plus_honey_weight/wifi_setup.yaml
# весов (там же — как у батареи Deye). Нужна, когда у роутера сменили сеть/пароль: включить
# сервисный режим → подключиться к точке доступа датчика «MoveSensorBLE-<Device ID>», напр. MoveSensorBLE-148F98 (ms_ap.h) → сайт →
# «Wi-Fi роутера». Работает только в сервисном режиме (в рабочем Wi-Fi выключен).
#
# Штатный wifi.configure (esphome/components/wifi/automation.h):
#   • ssid совпадает с текущим и связь есть — ничего не делает, считается успехом;
#   • save: true пишет в NVS сразу, а при неудаче за timeout САМ откатывает на прежние;
#   • на время попытки гасит радио целиком (STA и AP) — ms_ap.h поднимает AP за ~1 с.
# Скан — фоновый (ms_ap::scan_networks), связь с роутером не рвёт; штатный start_scanning()
# переподключал Wi-Fi и сайт отваливался (2026-11-11).
# Жёсткий (заводской) сброс без отката — 5 включений сервисного переключателя за 20 с
# (move_sensor_ble/base.yaml, service_enter -> factory_reset_net): сеть из прошивки + заводской пароль точки.
#
# Пароль своей точки доступа (2026-11-15): «New AP Password» -> «Save AP password» (8–63 символа ASCII).
# Хранится во флеше (globals ap_password_custom), точка сразу перезапускается с новым паролем.

# Для окна «Wi-Fi роутера»: текущая сеть (пусто — нет связи) и список найденных сетей
# "SSID: -63dB" по строке (обновляется на сканах самого wifi и по кнопке).
text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_ssid_now
      name: "Wi-Fi SSID"
      icon: "mdi:wifi"
      entity_category: diagnostic
    scan_results:
      id: wifi_scan_results
      name: "Wi-Fi Scan Results"
      icon: "mdi:wifi-marker"
      entity_category: diagnostic
    ip_address:
      id: wifi_ip
      name: "WiFi IP"
      icon: "mdi:ip-network"
      entity_category: diagnostic
  # какой пароль у своей точки сейчас: default (заводской, на наклейке) / custom (задан с сайта)
  - platform: template
    id: ap_password_mode
    name: "AP password"
    icon: "mdi:access-point-network"
    entity_category: diagnostic
    update_interval: never
    lambda: 'return {id(ap_password_custom).size() >= 8 ? "custom" : "default"};'

text:
  - platform: template
    name: "New Wi-Fi SSID"
    id: new_wifi_ssid
    mode: text
    optimistic: true
    max_length: 32
    entity_category: config
    icon: "mdi:wifi-plus"

  - platform: template
    name: "New Wi-Fi Password"
    id: new_wifi_password
    mode: password
    optimistic: true
    max_length: 64
    entity_category: config
    icon: "mdi:form-textbox-password"
    # Значение уходит в JSON открытым текстом — стираем, если 5 мин не нажали «Reconnect to router».
    on_value:
      - if:
          condition:
            lambda: 'return !x.empty();'
          then:
            - script.execute: wifi_password_autoclear

  - platform: template
    name: "New AP Password"
    id: new_ap_password
    mode: password
    optimistic: true
    max_length: 63
    entity_category: config
    icon: "mdi:access-point-network"
    on_value:
      - if:
          condition:
            lambda: 'return !x.empty();'
          then:
            - script.execute: ap_password_autoclear

script:
  - id: ap_password_autoclear
    mode: restart
    then:
      - delay: 5min
      - text.set:
          id: new_ap_password
          value: ""

  - id: wifi_password_autoclear
    mode: restart
    then:
      - delay: 5min
      - text.set:
          id: new_wifi_password
          value: ""

button:
  # Пустое поле SSID → переподключиться к текущей сети (save: false);
  # заполнено → сохранить и подключиться к новой (save: true, откат сам при неудаче).
  - platform: template
    name: "Reconnect to router"
    id: reconnect_wifi
    icon: "mdi:wifi-sync"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: 'return !id(new_wifi_ssid).state.empty();'
          then:
            - wifi.configure:
                ssid: !lambda 'return id(new_wifi_ssid).state;'
                password: !lambda 'return id(new_wifi_password).state;'
                save: true
                timeout: 20s
                on_connect:
                  - logger.log: "reconnect_wifi: connected, new network saved"
                  - text.set: {id: new_wifi_ssid, value: ""}
                  - text.set: {id: new_wifi_password, value: ""}
                on_error:
                  - logger.log:
                      format: "reconnect_wifi: new network failed - wifi.configure rolled back"
                      level: WARN
                  - text.set: {id: new_wifi_ssid, value: ""}
                  - text.set: {id: new_wifi_password, value: ""}
          else:
            - wifi.configure:
                ssid: !secret wifi_ssid
                password: !secret wifi_password
                save: false
                timeout: 20s
                on_connect:
                  - logger.log: "reconnect_wifi: reconnected to current router"
                on_error:
                  - logger.log:
                      format: "reconnect_wifi: reconnect to current router failed"
                      level: WARN

  - platform: template
    name: "Scan Wi-Fi networks"
    id: scan_wifi_networks
    icon: "mdi:wifi-refresh"
    entity_category: diagnostic
    on_press:
      - lambda: 'ms_ap::scan_networks();'

  # Новый пароль своей точки: 8–63 печатных ASCII (требование WPA2). Ответ сайту уходит,
  # через 1.5 с точка перезапускается с новым паролем (телефон отключится — войти заново).
  - platform: template
    name: "Save AP password"
    id: save_ap_password
    icon: "mdi:content-save-cog"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: |-
              const std::string &p = id(new_ap_password).state;
              if (p.size() < 8 || p.size() > 63) return false;
              for (char ch : p) if (ch < 0x20 || ch > 0x7e) return false;
              return true;
          then:
            - lambda: |-
                id(ap_password_custom) = id(new_ap_password).state;
                ESP_LOGW("ms", "AP password: custom saved (%u chars)", (unsigned) id(ap_password_custom).size());
            - text.set: {id: new_ap_password, value: ""}
            - component.update: ap_password_mode
            - delay: 1500ms
            - lambda: |-
                global_preferences->sync();
                ms_ap::set_password(id(ap_password_custom));
          else:
            - logger.log:
                format: "AP password rejected: need 8-63 printable ASCII characters"
                level: WARN
            - text.set: {id: new_ap_password, value: ""}

  # Жёсткий сброс: NVS снова на сеть из прошивки (secrets.yaml), и после перезагрузки тоже.
  - platform: template
    name: "Reset Wi-Fi to firmware defaults"
    id: reset_wifi_to_firmware
    icon: "mdi:backup-restore"
    entity_category: diagnostic
    on_press:
      - wifi.configure:
          ssid: !secret wifi_ssid
          password: !secret wifi_password
          save: true
          timeout: 20s
          on_connect:
            - logger.log: "reset_wifi_to_firmware: back on firmware network"
          on_error:
            - logger.log:
                format: "reset_wifi_to_firmware: firmware network failed - rolled back"
                level: WARN
