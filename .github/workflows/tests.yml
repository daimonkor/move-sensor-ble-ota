# Unit tests without Home Assistant: BLE custom block parsing, version string, firmware fingerprint.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m pytest -q tests
